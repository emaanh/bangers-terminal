<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bangers terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root { --bg: #0c0c0c; --fg: #d8d5cc; --dim: #7d7a72; --acc: #ffb000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(14px, 1.75vw, 28px);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  #screen { min-height: 100%; padding: 4vh 4vw; display: flex; flex-direction: column; }
  /* stats is ~56 columns: sized so it still fits when the window is half the screen */
  #screen.compact { font-size: clamp(14px, 2.4vw, 28px); line-height: 1.4; }
  .l { white-space: pre; min-height: 1.55em; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; justify-content: space-between; }
  .grow { flex: 1; }
  .d { color: var(--dim); }
  .a { color: var(--acc); }
  .cur { display: inline-block; width: 0.6em; height: 1.1em; background: var(--acc); vertical-align: -0.2em; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="screen"></div>
<script>
'use strict';

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// app: corner names + current game (survives a refresh)
let app = store.get('bt.app', null) || { slots: { 1: null, 2: null, 3: null, 4: null }, game: null };
// ui: transient state, never saved
const ui = { field: 1, who: null, view: 'live', help: false, confirm: false, flash: '' };

const save = () => store.set('bt.app', app);

// ---------- game model ----------
const SLOTS = [1, 2, 3, 4];
const side = (s) => (s <= 2 ? 'left' : 'right');
const other = (sd) => (sd === 'left' ? 'right' : 'left');
const mate = (s) => ({ 1: 2, 2: 1, 3: 4, 4: 3 }[s]);
const nameOf = (s) => app.slots[s] || '?';
// home row: left hand picks who threw (a s = left side, d f = right side),
// right hand says what happened, so nothing depends on whose turn it "should" be
const KEY = { 1: 'a', 2: 's', 3: 'd', 4: 'f' };
const WHO = { a: 1, s: 2, d: 3, f: 4 };
const ACT = { j: 'hit', k: 'miss', ';': 'fin' };
const ord = (n) => n + (['th', 'st', 'nd', 'rd'][n] || 'th');

function newGame() {
  app.game = { events: [], startAt: Date.now() };
  ui.view = 'live'; ui.help = false; ui.who = null;
}

// Everything on screen is derived from the event list, so undo is just pop().
function derive(g) {
  const st = {
    finished: {}, place: 0, over: null, pending: null, next: null,
    p: {}, log: [], hitsTaken: { left: 0, right: 0 }, stops: { left: [], right: [] },
  };
  SLOTS.forEach((s) => (st.p[s] = { thrown: 0, hit: 0, miss: 0, unk: 0 }));
  let lastHit = null;
  // sides throw in pairs: after one teammate throws, assume the other is next;
  // after the pair, nobody is assumed since either player can start the other side
  let pairFirst = null;
  for (const e of g.events) {
    if (e.t === 'throw') {
      const ps = st.p[e.p];
      ps.thrown++; ps[e.r]++;
      const word = { hit: 'hit', miss: 'miss', unk: "didn't see" }[e.r];
      st.log.push(nameOf(e.p).padEnd(9) + word);
      if (e.r === 'hit') { st.hitsTaken[other(side(e.p))]++; lastHit = e; } else lastHit = null;
      if (pairFirst && e.p === mate(pairFirst)) pairFirst = st.next = null;
      else { pairFirst = e.p; st.next = mate(e.p); }
    } else if (e.t === 'stop' && lastHit) {
      const def = other(side(lastHit.p));
      if (e.skip) st.log[st.log.length - 1] += ' · not timed';
      else {
        st.stops[def].push(e.ms);
        st.log[st.log.length - 1] += ` · ${def} stopped it in ${(e.ms / 1000).toFixed(1)}s`;
      }
      lastHit = null;
    } else if (e.t === 'fin') {
      st.finished[e.p] = ++st.place;
      const txt = `${nameOf(e.p)} finished ${ord(st.place)}`;
      if (st.log.length) st.log[st.log.length - 1] += ' · ' + txt; else st.log.push(txt);
      const sd = side(e.p);
      if (!st.over && st.finished[mate(e.p)]) st.over = sd;
    }
  }
  st.pending = st.over ? null : lastHit;
  return st;
}

// ---------- sound ----------
// every keypress answers with a tone, so you never have to look at the screen
let actx;
function tone(freq, ms = 70, type = 'sine', delay = 0) {
  try {
    actx = actx || new AudioContext();
    const t = actx.currentTime + delay / 1000, o = actx.createOscillator(), v = actx.createGain();
    o.type = type; o.frequency.value = freq;
    v.gain.setValueAtTime(0.15, t); v.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
    o.connect(v).connect(actx.destination); o.start(t); o.stop(t + ms / 1000);
  } catch {}
}
const SOUND = {
  who: (s) => tone({ 1: 440, 2: 520, 3: 620, 4: 740 }[s], 50), // each corner has its own pitch
  hit: () => { tone(660); tone(990, 90, 'sine', 70); },
  miss: () => tone(300, 120),
  fin: () => { tone(520); tone(660, 70, 'sine', 80); tone(780, 120, 'sine', 160); },
  stop: () => tone(1200, 50),
  undo: () => { tone(500, 50); tone(350, 70, 'sine', 60); },
  no: () => tone(110, 150, 'square'),
};

// ---------- rendering ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
const line = (html, cls = '') => `<div class="l ${cls}">${html || ' '}</div>`;
const header = (left, right = '') => `<div class="l row">${sp('d', left)}${sp('d', right)}</div>`;
const grow = '<div class="grow"></div>';
const pct = (h, n) => (n ? Math.round((100 * h) / n) + '%' : '—');
const clock = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const cursor = '<span class="cur"></span>';
const COL = 38;

function setupCell(s) {
  const n = app.slots[s] || '';
  if (ui.field === s) return sp('a', `> ${KEY[s]} ${n}`) + cursor + ' '.repeat(Math.max(0, COL - 5 - n.length));
  return (n ? `  ${KEY[s]} ${esc(n)}` : `  ${KEY[s]} ${sp('d', '____')}`) + ' '.repeat(Math.max(0, COL - 4 - (n || '____').length));
}

function renderSetup() {
  const out = [
    header('bangers terminal · new game'),
    line(''),
    line(sp('d', '  left'.padEnd(COL) + '  right')),
    line(setupCell(1) + setupCell(3)),
    line(setupCell(2) + setupCell(4)),
    grow,
  ];
  const ready = SLOTS.every((s) => app.slots[s]);
  out.push(line(`${sp('a', '›')} ${esc(ui.flash || (ready ? 'enter to start' : 'type the name at each corner'))}`), line(''), line('enter next   arrows move   esc clear', 'd'));
  return out.join('');
}

function playerCell(s, st) {
  const n = nameOf(s);
  const p = st.p[s];
  const done = st.finished[s] ? '   done ' + ord(st.finished[s]) : '';
  const txt = `${KEY[s]} ${n.padEnd(9)}${(p.hit + '/' + p.thrown).padEnd(6)}${pct(p.hit, p.hit + p.miss).padEnd(4)}${done}`;
  const picked = s === (ui.who || st.next);
  return sp(picked ? 'a' : '', ((picked ? '> ' : '  ') + txt).padEnd(COL));
}

function renderLive() {
  const g = app.game, st = derive(g);
  const out = [
    `<div class="l row">${sp('d', 'bangers terminal')}<span class="d" id="clock">${clock(Date.now() - g.startAt)}</span></div>`,
    line(''),
    line(sp('d', '  left'.padEnd(COL) + '  right')),
    line(playerCell(1, st) + playerCell(3, st)),
    line(playerCell(2, st) + playerCell(4, st)),
    grow,
  ];
  if (ui.help) {
    [
      'a s  left side     d f  right side',
      'j  hit     k  miss     ;  finished',
      'space  stop timer     x  don\'t time it',
      'u  undo     n  new game     tab  stats',
      'esc  cancel / close',
    ].forEach((t) => out.push(line('  ' + esc(t))));
  } else {
    const last = st.log.slice(-3);
    while (last.length < 3) last.unshift('');
    last.forEach((t) => out.push(line(t && sp('d', '  ' + t))));
  }
  out.push(line(''), ...inputLines(st));
  if (!ui.confirm && !st.over) out.push(line("a s d f who   then   j hit   k miss   ; finished", 'd'), line('u undo   tab stats   n new game   ? keys', 'd'));
  return out.join('');
}

// the prompt area, shared by the live and stats views so you can record from either
function inputLines(st) {
  ui.timerAt = st.pending ? st.pending.at : null;
  if (ui.confirm) return [line(''), line(`${sp('a', '›')} end this game?  ${sp('d', 'n yes  esc no')}  ${cursor}`), line('')];
  if (st.over) return [line(''), line(sp('a', `${st.over} wins`)), line('enter rematch  esc new game  u undo', 'd')];
  const out = [];
  if (st.pending) {
    const def = other(side(st.pending.p));
    out.push(line(`${esc(def)} defending  <span class="a" id="timer">${((Date.now() - st.pending.at) / 1000).toFixed(1)}s</span>   ${sp('d', "space stop  x skip")}`));
  } else out.push(line(''));
  if (ui.who) out.push(line(`${sp('a', nameOf(ui.who) + ' ›')} hit ${sp('d', '(j)')}  miss ${sp('d', '(k)')}  finished ${sp('d', '(;)')}  ${cursor}`));
  else if (st.next) out.push(line(`${sp('a', nameOf(st.next) + ' ›')} hit ${sp('d', '(j)')}  miss ${sp('d', '(k)')}  ${sp('d', 'or a s d f')}  ${cursor}`));
  else out.push(line(`${sp('a', '›')} who? ${sp('d', 'a s d f')}  ${cursor}`));
  return out;
}

function teamStats(st) {
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length / 1000 : null);
  const avgs = { left: avg(st.stops.left), right: avg(st.stops.right) };
  const t = { stop: {}, drank: {}, best: null };
  if (avgs.left != null && avgs.right != null) t.best = avgs.left <= avgs.right ? 'left' : 'right';
  for (const sd of ['left', 'right']) {
    t.stop[sd] = avgs[sd] == null ? '—' : avgs[sd].toFixed(1) + 's';
    // a side drinks for the other side's avg stop time on every hit it lands
    const o = other(sd);
    t.drank[sd] = avgs[o] == null ? '—' : (avgs[o] * st.hitsTaken[o]).toFixed(1) + 's';
  }
  return t;
}

function teamLines(st) {
  const t = teamStats(st), out = [line('teams        hits taken   avg stop time   time drinking', 'd')];
  for (const sd of ['left', 'right']) {
    out.push(line(esc(`  ${sd.padEnd(18)}${String(st.hitsTaken[sd]).padStart(3)}${' '.repeat(16 - t.stop[sd].length)}`)
      + sp(sd === t.best ? 'a' : '', t.stop[sd]) + esc(t.drank[sd].padStart(16))));
  }
  return out;
}

function barLines(st) {
  const out = [line('hit %', 'd')];
  const rows = SLOTS.map((s) => ({ n: nameOf(s), h: st.p[s].hit, k: st.p[s].hit + st.p[s].miss }))
    .sort((a, b) => (b.k ? b.h / b.k : -1) - (a.k ? a.h / a.k : -1));
  for (const r of rows) {
    const f = r.k ? Math.round((24 * r.h) / r.k) : 0;
    out.push(line(`  ${esc(r.n.padEnd(8))}${sp('a', '█'.repeat(f))}${sp('d', '░'.repeat(24 - f))}  ${pct(r.h, r.k)}`));
  }
  return out;
}

function renderStats() {
  const g = app.game, st = derive(g);
  const out = [`<div class="l row">${sp('d', 'bangers terminal · stats')}<span class="d" id="clock">${clock(Date.now() - g.startAt)}</span></div>`, line('')];
  out.push(line('               thrown   hit   hit %   finished', 'd'));
  for (const sd of ['left', 'right']) {
    out.push(line(sd, 'd'));
    for (const s of SLOTS.filter((x) => side(x) === sd)) {
      const p = st.p[s];
      const fin = st.finished[s] ? ord(st.finished[s]) : '';
      const picked = s === (ui.who || st.next);
      out.push(line(sp(picked ? 'a' : '', `${picked ? '> ' : '  '}${KEY[s]} ${nameOf(s).padEnd(12)}${String(p.thrown).padStart(3)}   ${String(p.hit).padStart(3)}   ${pct(p.hit, p.hit + p.miss).padStart(5)}   ${fin}`)));
    }
  }
  out.push(line(''), ...teamLines(st), line(''), ...barLines(st));
  out.push(grow, ...inputLines(st));
  if (!ui.confirm && !st.over) out.push(line('j hit  k miss  ; finished  u undo  tab back', 'd'));
  return out.join('');
}

const screen = document.getElementById('screen');
function render() {
  screen.classList.toggle('compact', !!app.game && ui.view === 'stats');
  screen.innerHTML = !app.game ? renderSetup() : ui.view === 'stats' ? renderStats() : renderLive();
}

// Only the timer and clock text change between keypresses.
function tick() {
  if (app.game) {
    const t = document.getElementById('timer');
    if (t && ui.timerAt) t.textContent = ((Date.now() - ui.timerAt) / 1000).toFixed(1) + 's';
    const c = document.getElementById('clock');
    if (c) { const v = clock(Date.now() - app.game.startAt); if (c.textContent !== v) c.textContent = v; }
  }
  requestAnimationFrame(tick);
}

// ---------- input ----------
function onSetupKey(e) {
  const k = e.key;
  ui.flash = '';
  const f = ui.field, n = app.slots[f] || '';
  if (k === 'Enter') {
    // all four named: go pick the starter; otherwise jump to the next empty corner
    if (SLOTS.every((s) => app.slots[s])) newGame();
    else ui.field = [1, 2, 3, 4].map((i) => ((f + i - 1) % 4) + 1).find((s) => !app.slots[s]);
  } else if (k === 'Tab') ui.field = e.shiftKey ? ((f + 2) % 4) + 1 : (f % 4) + 1;
  else if (k === 'ArrowLeft' || k === 'ArrowRight') ui.field = { 1: 3, 2: 4, 3: 1, 4: 2 }[f];
  else if (k === 'ArrowUp' || k === 'ArrowDown') ui.field = mate(f);
  else if (k === 'Escape') app.slots[f] = null;
  else if (k === 'Backspace') app.slots[f] = n.slice(0, -1) || null;
  else if (k.length === 1 && k !== ' ' && n.length < 12) app.slots[f] = n + k.toLowerCase();
  else return false;
  return true;
}

function onGameKey(e) {
  const k = e.key, g = app.game, st = derive(g);
  const push = (ev) => g.events.push({ ...ev, at: Date.now() });

  // any key other than a second n cancels the confirm
  if (ui.confirm) {
    ui.confirm = false;
    if (k === 'n') { app.game = null; ui.field = 1; }
    return true;
  }
  if (k === 'Escape') {
    if (ui.who) ui.who = null;
    else if (ui.help) ui.help = false;
    else if (st.over) { app.game = null; ui.field = 1; }
    else if (ui.view === 'stats') ui.view = 'live';
    else if (!g.events.length) app.game = null;
    else return false;
    return true;
  }
  if (k === 'n') { ui.confirm = true; ui.help = false; ui.who = null; return true; }
  // help lives on the live view
  if (k === '?') { ui.help = ui.view === 'stats' || !ui.help; ui.view = 'live'; return true; }
  if (k === 'Tab') { ui.view = ui.view === 'stats' ? 'live' : 'stats'; ui.help = false; return true; }
  if (k === 'u' || k === 'Backspace') {
    // half-typed command: drop it; otherwise take back the last thing recorded
    if (ui.who) ui.who = null;
    else if (!g.events.pop()) return false;
    SOUND.undo();
    return true;
  }
  if (st.over) {
    if (k === 'Enter') newGame(); else return false;
    return true;
  }
  if (WHO[k]) { ui.who = WHO[k]; SOUND.who(ui.who); return true; }
  if (k === ' ' || k === 'x') {
    if (!st.pending) return false;
    push(k === ' ' ? { t: 'stop', ms: Date.now() - st.pending.at } : { t: 'stop', skip: true });
    SOUND.stop();
    return true;
  }
  // a throw while the timer runs just leaves that hit untimed
  const act = ACT[k];
  // throws fall back to the assumed teammate; finishing always needs a player key
  const who = ui.who || (act !== 'fin' && st.next);
  if (!act || !who || (act === 'fin' && st.finished[who])) return false;
  push(act === 'fin' ? { t: 'fin', p: who } : { t: 'throw', p: who, r: act });
  ui.who = null;
  SOUND[act]();
  return true;
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const handled = app.game ? onGameKey(e) : onSetupKey(e);
  if (handled) { e.preventDefault(); save(); render(); }
  else {
    if (app.game && e.key.length === 1) SOUND.no();
    if (['Tab', ' ', 'Backspace'].includes(e.key)) e.preventDefault();
  }
});

render();
requestAnimationFrame(tick);
</script>
</body>
</html>
